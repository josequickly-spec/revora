apiVersion: apps/v1
kind: Deployment
metadata:
  name: revora
  labels: {app: revora, track: stable}
spec:
  replicas: 3
  selector:
    matchLabels: {app: revora, track: stable}
  template:
    metadata:
      labels: {app: revora, track: stable}
    spec:
      serviceAccountName: revora
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: ghcr.io/replace-with-owner/revora:replace-with-sha
          ports: [{name: http, containerPort: 3000}]
          envFrom:
            - configMapRef: {name: revora-config}
            - secretRef: {name: revora-secrets}
          readinessProbe:
            httpGet: {path: /api/observability/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/observability/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
