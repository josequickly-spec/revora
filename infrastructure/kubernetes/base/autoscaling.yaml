apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: revora
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: revora}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: revora
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: revora, track: stable}
