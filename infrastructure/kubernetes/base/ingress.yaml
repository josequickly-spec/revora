apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: revora
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [revora.example.com]
      secretName: revora-tls
  rules:
    - host: revora.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: revora, port: {name: http}}
