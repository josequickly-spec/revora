apiVersion: batch/v1
kind: Job
metadata:
  name: revora-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/replace-with-owner/revora:replace-with-sha
          command: ["node","scripts/init-db.mjs"]
          envFrom:
            - secretRef: {name: revora-secrets}
